# G1 concurrent timing lines — tags [gc] — "GC(N) Concurrent Cycle Nms" style
# These include G1 Young-Only concurrent phases shown in JDK 17+

- id: gc_metaspace_sizing
  tags: [gc, metaspace]
  level: info
  pattern: 'GC\((\d+)\) Metaspace: (\d+[KMG]?)->(\d+[KMG]?)\((\d+[KMG]?)\)'
  fields:
    gcId: int
    metaspaceBefore: bytes
    metaspaceAfter: bytes
    metaspaceCommitted: bytes
  table: jvmlog_metaspace

- id: gc_metaspace_class_space
  tags: [gc, metaspace]
  level: info
  pattern: 'GC\((\d+)\) class space\s+(\d+[KMG]?)->(\d+[KMG]?)\((\d+[KMG]?)\)'
  fields:
    gcId: int
    classSpaceBefore: bytes
    classSpaceAfter: bytes
    classSpaceCommitted: bytes
  table: jvmlog_metaspace

- id: gc_stringdedup_savings
  tags: [gc, stringdedup]
  level: info
  pattern: 'GC\((\d+)\) Savings: (\d+) bytes in (\d+) objects'
  fields:
    gcId: int
    savedBytes: long
    objectCount: long
  table: jvmlog_stringdedup

- id: gc_stringdedup_exec
  tags: [gc, stringdedup]
  level: info
  pattern: 'GC\((\d+)\) Deduplication: (\d+) objects\s+\(([0-9.]+) ms\)'
  fields:
    gcId: int
    deduplicatedObjects: long
    durationMs: double
  table: jvmlog_stringdedup

# G1 Concurrent Cycle total duration — tags [gc]
# e.g.: GC(5) Concurrent Cycle 123.456ms
- id: g1_concurrent_cycle
  tags: [gc]
  level: info
  pattern: 'GC\((\d+)\) Concurrent Cycle ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  constants:
    phaseName: Concurrent Cycle
  table: jvmlog_gc_phase

# G1 Concurrent Mark from Roots duration — tags [gc,phases]
# e.g.: GC(5) Concurrent Mark from Roots 89.123ms
- id: g1_concurrent_mark_from_roots
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent Mark from Roots ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  constants:
    phaseName: Concurrent Mark from Roots
  table: jvmlog_gc_phase

# G1 Concurrent Mark Abort — marks that marking was aborted before completion
# e.g.: GC(5) Concurrent Mark Abort
- id: g1_concurrent_mark_abort
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent Mark Abort'
  fields:
    gcId: int
  constants:
    phaseName: Concurrent Mark Abort
  table: jvmlog_gc_phase

# G1 Rebuild Remembered Sets (JDK 17+ mixed GC helper phase)
# e.g.: GC(5) Concurrent Rebuild Remembered Sets and Scrub Regions 12.345ms
- id: g1_concurrent_rebuild_remsets
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent Rebuild Remembered Sets(?:[^0-9]*)([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  constants:
    phaseName: Concurrent Rebuild Remembered Sets
  table: jvmlog_gc_phase

# G1 Cleanup for Next Mark — tags [gc,phases]
# e.g.: GC(5) Concurrent Cleanup for Next Mark 1.234ms
- id: g1_concurrent_cleanup_next
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent Cleanup for Next Mark ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  constants:
    phaseName: Concurrent Cleanup for Next Mark
  table: jvmlog_gc_phase
