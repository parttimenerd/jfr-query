# Shenandoah GC patterns — tags [gc,shenandoah] or [gc]
# Shenandoah uses -Xlog:gc+shenandoah or gc* logging.

# Shenandoah init: "Shenandoah GC Mode: Saturation"
- id: shenandoah_init_mode
  tags: [gc, shenandoah]
  level: info
  pattern: 'Shenandoah GC Mode: (.+)'
  fields:
    gcMode: string
  table: jvmlog_gc_init

- id: shenandoah_init_heuristics
  tags: [gc, shenandoah]
  level: info
  pattern: 'Shenandoah Heuristics: (.+)'
  fields:
    heuristics: string
  table: jvmlog_gc_init

# Shenandoah concurrent phases (tagged with [gc,phases]):
# GC(0) Concurrent marking 56.789ms
- id: shenandoah_concurrent_marking
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent marking ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  table: jvmlog_gc_phase

- id: shenandoah_concurrent_evacuation
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent evacuation ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  table: jvmlog_gc_phase

- id: shenandoah_concurrent_update_refs
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent update references ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  table: jvmlog_gc_phase

- id: shenandoah_concurrent_cleanup
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent cleanup ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  table: jvmlog_gc_phase

- id: shenandoah_concurrent_reset_bitmaps
  tags: [gc, phases]
  level: info
  pattern: 'GC\((\d+)\) Concurrent reset bitmaps ([0-9.]+)ms'
  fields:
    gcId: int
    durationMs: double
  table: jvmlog_gc_phase

# Shenandoah STW pauses:
# GC(0) Pause Init Mark (unload classes) 1.234ms  — cause in parens, but type is "Init Mark" (two words)
# GC(0) Pause Final Mark (process weakrefs) 2.345ms — same
# GC(0) Pause Init Update Refs 0.234ms  — no cause paren
# GC(0) Pause Final Update Refs 1.234ms  — no cause paren
# GC(0) Pause Degenerated GC (Evacuation) ... — handled by gc_pause_event (single-word type "Degenerated")
- id: shenandoah_pause_init_mark
  tags: [gc]
  level: info
  pattern: 'GC\((\d+)\) Pause Init Mark(?: \(([^)]+)\))? ([0-9.]+)ms'
  fields:
    gcId: int
    cause: string
    pauseMs: double
  constants:
    gcType: Init Mark
  table: jvmlog_gc_event

- id: shenandoah_pause_final_mark
  tags: [gc]
  level: info
  pattern: 'GC\((\d+)\) Pause Final Mark(?: \(([^)]+)\))? ([0-9.]+)ms'
  fields:
    gcId: int
    cause: string
    pauseMs: double
  constants:
    gcType: Final Mark
  table: jvmlog_gc_event

- id: shenandoah_pause_init_update_refs
  tags: [gc]
  level: info
  pattern: 'GC\((\d+)\) Pause Init Update Refs ([0-9.]+)ms'
  fields:
    gcId: int
    pauseMs: double
  constants:
    gcType: Init Update Refs
  table: jvmlog_gc_event

- id: shenandoah_pause_final_update_refs
  tags: [gc]
  level: info
  pattern: 'GC\((\d+)\) Pause Final Update Refs ([0-9.]+)ms'
  fields:
    gcId: int
    pauseMs: double
  constants:
    gcType: Final Update Refs
  table: jvmlog_gc_event
